# Vendor-neutral SDLC specification.
# Generated by the Strike Labs SDLC Pipeline Designer. Safe to edit and commit.
version: 1

project:
  name: Autonomous feature delivery
  type: web-application
  description: "John’s Flow #1 orchestration flow."
  context:
    repository_responsibility: "Owns a single-page static web app that shows a rocket lift-off animation. This repository is Strike Labs' internal test target for Canon: pipeline changes are exercised here end to end before they reach customer repositories. It contains only static HTML, CSS, and vanilla JavaScript, with no backend, database, or build step."
    product_outcome: "A small, stable app that a Canon run can change, review, test, and release without human rework. A successful run delivers a working page change through a merged pull request with every required check green. The page loads instantly and works in current desktop and mobile browsers. It stays simple enough that any run failure points to Canon, not the app."
    primary_users: "Internal only. Strike Labs engineering uses this repository to validate Canon runs; there is a single maintainer who approves all changes. No external customers, no authentication, no personal data. Favor small, readable, easy-to-debug changes over features or polish."
    decision_priorities: "canon-priorities:v1:{\"order\":[\"simplicity\",\"correctness\",\"delivery-speed\",\"security\",\"data-integrity\",\"reliability\",\"observability\",\"maintainability\",\"backward-compatibility\",\"cost\"]}"
    must_preserve: >-
      The app runs by opening index.html or serving the folder statically, with no build step.
      Zero runtime dependencies and no package manager files unless the objective explicitly requests them.
      The page loads with no console errors and honors prefers-reduced-motion.
      Every change ships through a pull request with required checks green.
    must_not_do: >-
      Do not add package.json, frameworks, bundlers, or test runners unless the objective explicitly requests them.
      Do not add a backend, database, authentication, analytics, tracking, or external network calls.
      Do not load scripts, fonts, or assets from third-party CDNs.
      Do not modify .github/, .canon/, .sdlc/, or AGENTS.md.
      Do not commit secrets or credentials.
    non_goals: "Production hosting and uptime, customer-facing features, user accounts, payments, CRM, analytics, legacy browser support, and serving as an architecture template for other repositories."

architecture:
  frontend: None
  backend: None
  database: None
  infrastructure: None
  desktopRuntime: Electron
  aiIntegration: None
  styling: Tailwind CSS

environments:
  - copilot
  - development
  - "development (Bug triage fix verify)"
  - momma
  - production
  - "production (Bug triage fix verify)"
  - staging
  - "staging (Bug triage fix verify)"

workflow:
  branch_strategy: trunk-based
  pull_requests:
    required: true
  reviews:
    minimum_reviewers: 1
  testing:
    unit: none
    integration: none
    e2e: none
  deployment:
    mechanism: lovable
    staging:
      automatic: true
      command: ""
    production:
      approval_required: false
      command: ""

security:
  secret_scanning: required
  dependency_scanning: required
  sast: none

documentation:
  architecture: required
  api: required
  runbook: optional

pipeline:
  name: "John’s Flow #1"
  entry: requirements-analyst

agents:
  requirements-analyst:
    name: Requirements Analyst
    role: product_manager
    role_label: Product Manager
    output_artifact: spec
    description: Turns the feature request into a specification with scope and exclusions.
    task: Convert the feature request into a written requirements statement with scope and an explicit out-of-scope list.
    acceptance_criteria: "The requirements state the problem, the affected users, the scope, and the out-of-scope list without ambiguity."
    instructions: "You are the Requirements Analyst. Read the feature request, clarify intent, and write the requirements: the problem, the users affected, the scope, and what is explicitly out of scope. Ask for missing context rather than guessing. Do not write acceptance criteria — that is the next stage's job."
  acceptance-criteria-author:
    name: Acceptance Criteria Author
    role: product_manager
    role_label: Product Manager
    output_artifact: spec
    description: "Writes numbered, testable acceptance criteria from the requirements."
    task: "Write numbered, testable acceptance criteria covering the happy path, failure paths, and scope edges."
    acceptance_criteria: "Every requirement maps to at least one criterion, and each criterion is verifiable without further clarification."
    instructions: "You are the Acceptance Criteria Author. Read the requirements and write numbered acceptance criteria that a tester can verify without further clarification. Each criterion names the observable behaviour, the precondition, and the expected result. Cover the happy path, the failure paths, and the edges of the stated scope."
  feature-coder:
    name: Feature Coder
    role: coder
    role_label: Coder
    output_artifact: code_diff
    description: Implements the feature against the acceptance criteria and opens the pull request.
    task: "Implement the acceptance criteria, add tests, run the suite, and open a pull request mapping criteria to tests."
    acceptance_criteria: "The branch builds, the suite passes locally, every criterion has a test, and the diff stays inside the stated scope."
    instructions: "You are the Feature Coder agent. Implement exactly what the acceptance criteria describe, no more. Add or update tests for every criterion, run the suite locally, and open a pull request that summarises the change and maps each criterion to its test. Never merge, never force-push, never commit secrets, and never disable a failing test."
  code-reviewer:
    name: Code Reviewer
    role: code_reviewer
    role_label: Code Reviewer
    output_artifact: review_notes
    description: "Independent review of scope, correctness, security, and test coverage."
    task: "Review the diff against the acceptance criteria and record an approval or specific, actionable findings."
    acceptance_criteria: "Every finding names a file, a line, and the required change, and the review states one clear outcome."
    instructions: "You are the Code Reviewer agent. Review the pull request against the acceptance criteria for scope adherence, correctness, error handling, security, and test coverage. Never edit the code under review. Every finding must name a file, a line, and the change required. Approve when the diff is ready, or request changes with the specific findings."
  test-author:
    name: Test Author
    role: tester
    role_label: Tester
    output_artifact: test_report
    description: Writes and runs the automated tests that prove each acceptance criterion.
    task: "Write tests for each acceptance criterion, run the full suite against the branch, and report pass or fail with output."
    acceptance_criteria: "Every criterion has a test, the suite has been run against the candidate commit, and failures carry reproduction steps."
    instructions: "You are the Test Author agent. Write automated tests that prove each acceptance criterion on the candidate branch, then run the full suite and attach the output. Report a pass, or a failure with the failing test names and reproduction steps. Never weaken assertions or modify product code to get a green run."
  qa-verifier:
    name: QA Verifier
    role: qa
    role_label: QA
    output_artifact: test_report
    description: Confirms the change meets every acceptance criterion before release.
    task: "Run the repository's required check commands against the candidate commit, attach the output of each, and record an explicit pass or fail for every acceptance criterion with that output as evidence."
    acceptance_criteria: >-
      Every required check command resolved for the repository has been run against the candidate commit.
      The output of each command is attached to the report.
      Every acceptance criterion in the specification has an explicit pass or fail verdict.
      Every failing verdict names the failing command, its error output, and reproduction steps.
      Nothing in the repository was modified by this stage.
    instructions: "You are the QA Verifier. Your job is to run the repository's required check commands against the candidate commit and report the result. Run exactly the commands the repository resolves for this flow, in the order given, and attach the output of each. Then record an explicit pass or fail for every acceptance criterion in the specification, citing the command output as evidence. This stage is read-only: never edit application code, tests, configuration, or documentation, and never open or approve a pull request. When a check fails, report the failing command, the exact error output, and the steps to reproduce it. When the repository has no required check commands configured, say so plainly and report that no automated verification was possible."
  release-gatekeeper:
    name: Release Gatekeeper
    role: release_reviewer
    role_label: Release Reviewer
    output_artifact: approval
    description: Assesses release readiness and records the release decision.
    task: "Assess scope, migrations, rollback, monitoring, and blast radius, then record an approve or block decision."
    acceptance_criteria: "Each readiness area is assessed in writing, and the decision is either approved or blocked with a named mitigation."
    instructions: "You are the Release Gatekeeper. Assess release readiness for the candidate commit: scope, migrations, rollback plan, monitoring, and blast radius. Record an approval only when the review notes and the QA report are both clean. Block the release with the specific risk and the mitigation required when they are not. Never merge or deploy yourself."

transitions:
  - from: requirements-analyst
    to: acceptance-criteria-author
    when: Always
    label: Requirements defined
  - from: acceptance-criteria-author
    to: feature-coder
    when: Always
    label: Criteria ready
  - from: feature-coder
    to: test-author
    when: Always
    label: Branch ready for tests
  - from: test-author
    to: feature-coder
    when: If failed
    label: Tests failed
  - from: test-author
    to: qa-verifier
    when: If passed
    label: Tests passed
  - from: qa-verifier
    to: feature-coder
    when: If failed
    label: Checks failed
  - from: qa-verifier
    to: code-reviewer
    when: If passed
    label: Checks passed
  - from: code-reviewer
    to: feature-coder
    when: If changes required
    label: Changes required
  - from: code-reviewer
    to: release-gatekeeper
    when: If approved
    label: Review approved
  - from: release-gatekeeper
    to: feature-coder
    when: If blocked
    label: Release blocked
