# Vendor-neutral SDLC specification.
# Generated by the Strike Labs SDLC Pipeline Designer. Safe to edit and commit.
version: 1

project:
  name: Bug triage fix verify
  type: web-application
  description: "John’s Flow #5 orchestration flow."

architecture:
  frontend: React
  backend: Node.js
  database: Supabase
  infrastructure: AWS
  desktopRuntime: Electron
  aiIntegration: None
  styling: Tailwind CSS

environments:
  - development
  - staging
  - production

workflow:
  branch_strategy: trunk-based
  pull_requests:
    required: true
  reviews:
    minimum_reviewers: 1
  testing:
    unit: required
    integration: required
    e2e: optional
  deployment:
    mechanism: unknown
    staging:
      automatic: true
      command: ""
    production:
      approval_required: true
      command: ""

security:
  secret_scanning: required
  dependency_scanning: required
  sast: none

documentation:
  architecture: required
  api: required
  runbook: optional

pipeline:
  name: Beta
  entry: bug-triage

agents:
  bug-triage:
    name: Bug Triage
    role: product_manager
    role_label: Product Manager
    output_artifact: ticket
    description: "Confirms the reproduction, sets priority, and defines what fixed means."
    task: "Reproduce the report, write the reproduction steps, set priority and severity, and define the acceptance criteria for the fix."
    acceptance_criteria: "The ticket contains reproduction steps, expected versus observed behaviour, a priority, and testable acceptance criteria."
    instructions: "You are the Product Manager agent handling triage. Confirm the bug reproduces, capture the exact steps, the expected behaviour, and the observed behaviour, set the priority and severity, and define what fixed means as testable acceptance criteria. If it does not reproduce, say so and ask for the missing detail rather than guessing."
  coder:
    name: Coder
    role: coder
    role_label: Coder
    output_artifact: code_diff
    description: "Finds the root cause and implements a minimal, tested fix."
    task: "Diagnose the root cause, implement a minimal fix, and add a regression test that covers the reported reproduction."
    acceptance_criteria: "The root cause is written down, the fix is minimal, and a regression test fails without the fix and passes with it."
    instructions: "You are the Coder agent. Find the root cause of the bug, then implement the smallest fix that addresses it. Add a regression test that fails before the fix and passes after it. Do not refactor beyond the fix. Never merge and never disable a failing test. Return the diff with a written root-cause explanation."
  code-reviewer:
    name: Code Reviewer
    role: code_reviewer
    role_label: Code Reviewer
    output_artifact: review_notes
    description: "Reviews the fix for correctness, side effects, and coverage."
    task: Review the fix against the stated root cause and check the regression test actually covers the report.
    acceptance_criteria: The review confirms the fix matches the root cause and every finding is specific and actionable.
    instructions: "You are the Code Reviewer agent. Review the bug fix for correctness, unintended side effects, and regression coverage. Confirm the diagnosis matches the change. Do not edit the code. Approve, or request changes with findings that each name a file, a line, and the change required."
  fix-verification:
    name: Fix Verification
    role: tester
    role_label: Tester
    output_artifact: test_report
    description: Verifies the original reproduction is gone and nothing regressed.
    task: "Re-run the original reproduction and the full suite against the fix, and report the outcome with output attached."
    acceptance_criteria: "The original reproduction no longer occurs, the suite is green, and the evidence is attached."
    instructions: "You are the Tester agent. Verify the fix against the original reproduction steps, then run the full suite to confirm nothing else regressed. Attach the run output. Report a pass, or a failure with the exact step that still fails. Never weaken an assertion to get a green run. Do not edit source or tests."
  bug-closeout:
    name: Bug Closeout
    role: orchestrator
    role_label: Engineering Orchestrator
    output_artifact: status_update
    description: "Records the outcome, links the evidence, and closes the report."
    task: "Summarise the root cause and fix on the ticket, attach the evidence, and close the report."
    acceptance_criteria: "The ticket is closed with a root-cause summary and links to the diff, review notes, and test report."
    instructions: "You are the closeout orchestrator. Once the review is approved and the verification passed, summarise the root cause and the fix on the ticket, link the diff, the review notes, and the test report, and close the bug. Do not implement or modify code. Post the final STATUS: DONE comment."

transitions:
  - from: bug-triage
    to: coder
    when: Always
    label: Triaged and ready to fix
  - from: coder
    to: code-reviewer
    when: Always
    label: Fix ready for review
  - from: coder
    to: fix-verification
    when: Always
    label: Fix ready to verify
  - from: code-reviewer
    to: bug-closeout
    when: If approved
    label: Review approved
  - from: fix-verification
    to: bug-closeout
    when: If passed
    label: Verification passed
  - from: code-reviewer
    to: coder
    when: If changes required
    label: Changes required
  - from: fix-verification
    to: coder
    when: If failed
    label: Still reproduces
