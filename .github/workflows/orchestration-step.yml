# One tick of the run loop: plan the ready stages, execute them, route the results,
# then re-dispatch itself until the run completes, fails, or waits on a person.
name: Orchestration step

env:
  CANON_ROOT: .canon
  CANON_RUN_LABEL: canon-run
  CANON_START_LABEL: canon:start
  CANON_LABEL_SUFFIX: 
  CANON_STEP_WORKFLOW: orchestration-step.yml
  CANON_DEFAULT_BRANCH: main

on:
  workflow_dispatch:
    inputs:
      run_issue:
        description: Run issue number
        required: true

# Nothing is granted at workflow level; every job declares exactly what it needs.
permissions: {}


concurrency:
  group: canon-run-${{ inputs.run_issue }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      agents: ${{ steps.plan.outputs.agents }}
      gated: ${{ steps.plan.outputs.gated }}
      has_agents: ${{ steps.plan.outputs.has_agents }}
      has_gated: ${{ steps.plan.outputs.has_gated }}
      planned: ${{ steps.plan.outputs.planned }}
      status: ${{ steps.plan.outputs.status }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - id: plan
        run: node ${{ env.CANON_ROOT }}/tick.mjs plan --issue "$CANON_RUN_ISSUE"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANON_RUN_ISSUE: ${{ inputs.run_issue }}

  agents:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.has_agents == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Compiled from stage authority. Unlisted permissions are none, so a stage
    # cannot exercise a capability it was not granted in Canon.
    permissions:
      contents: read
      copilot-requests: write
      issues: read
    # Stages that own the same resource compile to the same lock group, so two
    # runs can never write one path, branch, or environment at the same time.
    concurrency:
      group: canon-lock-${{ matrix.lock }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.agents) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install coding agent
        run: |
          agent="${{ vars.CANON_CODING_AGENT || 'copilot' }}"
          case "$agent" in
            copilot) npm i -g @github/copilot@1.0.80 ;;
            claude)  npm i -g @anthropic-ai/claude-code@2.1.247 ;;
            codex)   npm i -g @openai/codex@0.150.1 ;;
            *) echo "Using custom coding agent command." ;;
          esac
      - name: Run stage
        run: node ${{ env.CANON_ROOT }}/run-stage.mjs --issue "$CANON_RUN_ISSUE" --stage "$CANON_STAGE"
        env:
          CANON_OUTBOX: ${{ env.CANON_ROOT }}/outbox
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANON_AGENT_PROVIDER: ${{ vars.CANON_AGENT_PROVIDER }}
          CANON_AGENT_COMMAND: ${{ vars.CANON_AGENT_COMMAND }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CANON_CODING_AGENT: ${{ vars.CANON_CODING_AGENT }}
          CANON_CODING_AGENT_COMMAND: ${{ vars.CANON_CODING_AGENT_COMMAND }}
          GITHUB_COPILOT_PROMPT_MODE_REPO_HOOKS: "true"
          CANON_RUN_ISSUE: ${{ inputs.run_issue }}
          CANON_STAGE: ${{ matrix.stage }}
      - name: Record a job-level failure
        if: failure() || cancelled()
        run: node ${{ env.CANON_ROOT }}/run-stage.mjs --report-failure --issue "$CANON_RUN_ISSUE" --stage "$CANON_STAGE" --reason "The stage job did not finish (job status ${{ job.status }})."
        env:
          CANON_OUTBOX: ${{ env.CANON_ROOT }}/outbox
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANON_RUN_ISSUE: ${{ inputs.run_issue }}
          CANON_STAGE: ${{ matrix.stage }}
      - name: Hand the result to the publisher
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canon-stage-${{ matrix.stage }}
          path: ${{ env.CANON_ROOT }}/outbox
          if-no-files-found: ignore
          retention-days: 7

  gated:
    name: ${{ matrix.name }} (approval)
    needs: plan
    if: needs.plan.outputs.has_gated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      copilot-requests: write
      issues: read
    concurrency:
      group: canon-lock-${{ matrix.lock }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.gated) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install coding agent
        run: |
          agent="${{ vars.CANON_CODING_AGENT || 'copilot' }}"
          case "$agent" in
            copilot) npm i -g @github/copilot@1.0.80 ;;
            claude)  npm i -g @anthropic-ai/claude-code@2.1.247 ;;
            codex)   npm i -g @openai/codex@0.150.1 ;;
            *) echo "Using custom coding agent command." ;;
          esac
      - name: Run stage
        run: node ${{ env.CANON_ROOT }}/run-stage.mjs --issue "$CANON_RUN_ISSUE" --stage "$CANON_STAGE"
        env:
          CANON_OUTBOX: ${{ env.CANON_ROOT }}/outbox
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANON_AGENT_PROVIDER: ${{ vars.CANON_AGENT_PROVIDER }}
          CANON_AGENT_COMMAND: ${{ vars.CANON_AGENT_COMMAND }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CANON_CODING_AGENT: ${{ vars.CANON_CODING_AGENT }}
          CANON_CODING_AGENT_COMMAND: ${{ vars.CANON_CODING_AGENT_COMMAND }}
          GITHUB_COPILOT_PROMPT_MODE_REPO_HOOKS: "true"
          CANON_RUN_ISSUE: ${{ inputs.run_issue }}
          CANON_STAGE: ${{ matrix.stage }}
      - name: Record a job-level failure
        if: failure() || cancelled()
        run: node ${{ env.CANON_ROOT }}/run-stage.mjs --report-failure --issue "$CANON_RUN_ISSUE" --stage "$CANON_STAGE" --reason "The stage job did not finish (job status ${{ job.status }})."
        env:
          CANON_OUTBOX: ${{ env.CANON_ROOT }}/outbox
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANON_RUN_ISSUE: ${{ inputs.run_issue }}
          CANON_STAGE: ${{ matrix.stage }}
      - name: Hand the result to the publisher
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canon-stage-${{ matrix.stage }}
          path: ${{ env.CANON_ROOT }}/outbox
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish
    needs: [plan, agents, gated]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    # The trusted publisher. Runs no agent output — only deterministic Canon code —
    # and is the single principal in a tick that may write to the repository. It
    # validates every stage patch against that stage's authority, ownership, size,
    # file-type, secret, and base-commit rules before committing anything.
    #
    # It does not hold a writing credential either. `id-token: write` is not
    # repository write: it lets this job prove to Canon which repository, workflow,
    # and run it is, and Canon returns an installation token scoped to this
    # repository that expires within the hour.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          path: ${{ env.CANON_ROOT }}/inbox
          pattern: canon-stage-*
          merge-multiple: true
      - run: node ${{ env.CANON_ROOT }}/publish.mjs --issue "$CANON_RUN_ISSUE" --inbox ${{ env.CANON_ROOT }}/inbox --outbox ${{ env.CANON_ROOT }}/outbox
        env:
          CANON_BROKER_URL: ${{ vars.CANON_BROKER_URL || 'https://usecanon.app/api/public/runtime/token' }}
          CANON_RUN_ISSUE: ${{ inputs.run_issue }}

      - name: Hand the published results to the reporter
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canon-result-published
          path: ${{ env.CANON_ROOT }}/outbox
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Report
    needs: [plan, publish]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    # Runs no agent code. This is the only job allowed to write the run ledger.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          path: ${{ env.CANON_ROOT }}/outbox
          pattern: canon-result-*
          merge-multiple: true
      - run: node ${{ env.CANON_ROOT }}/report.mjs --issue "$CANON_RUN_ISSUE" --outbox ${{ env.CANON_ROOT }}/outbox --stages "$CANON_PLANNED"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANON_RUN_ISSUE: ${{ inputs.run_issue }}
          CANON_PLANNED: ${{ needs.plan.outputs.planned }}

  advance:
    name: Advance
    needs: [plan, report]
    if: always() && needs.report.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: node ${{ env.CANON_ROOT }}/tick.mjs advance --issue "$CANON_RUN_ISSUE"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANON_RUN_ISSUE: ${{ inputs.run_issue }}
