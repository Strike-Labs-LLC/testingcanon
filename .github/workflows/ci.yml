# Generated from the SDLC blueprint (.sdlc/blueprint.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: npx --yes html-validate "**/*.html"
      - run: npx --yes linkinator . --recurse --silent --skip "^https?://"
