# Generated from the SDLC blueprint (.sdlc/blueprint.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: npx --yes html-validate "**/*.html"
      - run: npx --yes linkinator . --recurse --silent --skip "^https?://" --skip "node_modules|[.]canon|[.]sdlc"
