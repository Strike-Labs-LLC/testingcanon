# Hourly sweep: escalates human stages that have exceeded their response time.
name: Orchestration escalation

env:
  CANON_ROOT: .canon
  CANON_RUN_LABEL: canon-run
  CANON_START_LABEL: canon:start
  CANON_LABEL_SUFFIX: 
  CANON_STEP_WORKFLOW: orchestration-step.yml
  CANON_DEFAULT_BRANCH: main

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: node ${{ env.CANON_ROOT }}/escalate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
