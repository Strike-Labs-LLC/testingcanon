# Hourly sweep: escalates human stages that have exceeded their response time.
name: Orchestration escalation

env:
  CANON_ROOT: .canon
  CANON_RUN_LABEL: canon-run
  CANON_START_LABEL: canon:start
  CANON_LABEL_SUFFIX: 
  CANON_STEP_WORKFLOW: orchestration-step.yml
  CANON_DEFAULT_BRANCH: main

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - run: node ${{ env.CANON_ROOT }}/escalate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
