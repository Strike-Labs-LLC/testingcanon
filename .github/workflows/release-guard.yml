# Closes the alternate release path.
# Any release or `v*` tag that was not produced from an approved Canon run is rejected:
# the release is forced back to draft and this check fails loudly.
name: Release guard

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published, created, released]

permissions:
  contents: read
  issues: read

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: verify
        continue-on-error: true
        run: node .canon/release.mjs verify --sha "$TAG_SHA"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_SHA: ${{ github.sha }}
      - name: Withdraw unapproved release
        if: steps.verify.outcome == 'failure' && github.event_name == 'release'
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/releases/${{ github.event.release.id }}" \
            -F draft=true -f body="Withdrawn: this release was not produced from an approved Canon run."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fail on unapproved release
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::error::This commit was not approved by a Canon run. Use the Release workflow with an approved run issue."
          exit 1
