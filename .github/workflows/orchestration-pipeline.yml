# Starts an orchestration run for Autonomous production engineering.
# The run record lives in a GitHub issue labelled `canon-run`; every stage result and
# human decision is appended to that issue, so the whole run is auditable in the repo.
name: Orchestration pipeline

env:
  CANON_ROOT: .canon
  CANON_RUN_LABEL: canon-run
  CANON_START_LABEL: canon:start
  CANON_LABEL_SUFFIX: 
  CANON_STEP_WORKFLOW: orchestration-step.yml
  CANON_DEFAULT_BRANCH: main

on:
  workflow_dispatch:
    inputs:
      objective:
        description: What this run should deliver
        required: false
        default: ''
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  actions: write
  id-token: write

jobs:
  start:
    # GitHub emits one `labeled` event per label, including labels chosen while
    # the issue is being created, so opening a pre-labelled issue starts the run
    # exactly once — matching on `opened` as well would start it twice.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'canon:start'


    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      # The objective is attacker-controlled text (an issue title). It is bound to an
      # environment variable and never interpolated into the shell command, so a title
      # containing shell metacharacters is data, not code.
      - name: Start run
        run: node ${{ env.CANON_ROOT }}/start-run.mjs --objective "$CANON_OBJECTIVE" --trigger "$CANON_TRIGGER" --issue "$CANON_SOURCE_ISSUE" --sha "$CANON_BASE_SHA"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANON_OBJECTIVE: ${{ github.event.inputs.objective || github.event.issue.title }}
          CANON_TRIGGER: ${{ github.event_name }}
          CANON_SOURCE_ISSUE: ${{ github.event.issue.number }}
          CANON_SOURCE_ISSUE_URL: ${{ github.event.issue.html_url }}
          # The ticket body is attacker-controlled text. Like the title, it is bound
          # to an environment variable and never interpolated into the command line,
          # so a body containing shell metacharacters is data, not code.
          CANON_SOURCE_ISSUE_BODY: ${{ github.event.issue.body }}
          CANON_BASE_SHA: ${{ github.sha }}
          CANON_AUTHORIZE_URL: ${{ vars.CANON_AUTHORIZE_URL || 'https://usecanon.app/api/public/runtime/authorize' }}
          CANON_BROKER_URL: ${{ vars.CANON_BROKER_URL || 'https://usecanon.app/api/public/runtime/token' }}
          CANON_AGENT_PROVIDER: ${{ vars.CANON_AGENT_PROVIDER }}
          CANON_CODING_AGENT: ${{ vars.CANON_CODING_AGENT }}
          # Canon's own secrets page asks for a Copilot token, and this used to
          # overwrite it with the job's Actions token — which carries no Copilot
          # seat, so every agent stage failed with "Access denied by policy
          # settings" no matter what the customer pasted. The pasted secret wins;
          # the Actions token remains the default, which works where the
          # organization allows Copilot CLI billed to it.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          # Which of the two the run ended up on, so a Copilot refusal can name
          # the right remedy instead of guessing at one.
          CANON_COPILOT_TOKEN_SUPPLIED: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
