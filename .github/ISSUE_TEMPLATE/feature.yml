name: Feature
description: A new capability that enters the Bug triage fix verify SDLC pipeline.
title: "[Feature] "
labels: ["feature", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Every field below feeds the pipeline defined in AGENTS.md. Incomplete items are
        returned at triage.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is not working or not possible today?
    validations:
      required: true
  - type: input
    id: user
    attributes:
      label: Affected user
      description: Who has this problem?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One testable statement per line, written as Given / When / Then.
    validations:
      required: true
  - type: dropdown
    id: security
    attributes:
      label: Security implications
      options:
        - None
        - Touches authentication or authorization
        - Touches personal or regulated data
        - Touches payments or billing
        - Unsure — needs security review
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Data implications
      options:
        - No schema change
        - Additive schema change
        - Destructive or migrating schema change
        - Unsure
    validations:
      required: true
  - type: textarea
    id: ux
    attributes:
      label: UX impact
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and out of scope
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, logs, or links.
  - type: checkboxes
    id: ready
    attributes:
      label: Definition of Ready
      options:
        - label: Acceptance criteria are testable
          required: true
        - label: Security and data implications are recorded
          required: true
