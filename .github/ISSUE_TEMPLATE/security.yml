name: Security issue (non-sensitive)
description: Security hardening work that is safe to discuss publicly.
title: "[Security] "
labels: ["security", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report exploitable vulnerabilities here. Use a private security advisory —
        see SECURITY.md.
  - type: textarea
    id: weakness
    attributes:
      label: Weakness
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication
        - Authorization
        - Data handling
        - Dependencies
        - Infrastructure
        - Logging and monitoring
    validations:
      required: true
  - type: textarea
    id: remediation
    attributes:
      label: Proposed remediation
    validations:
      required: true
