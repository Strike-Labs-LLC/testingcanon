name: Technical debt
description: Work that improves maintainability, performance, or operability.
title: "[Tech debt] "
labels: ["tech-debt", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is wrong today
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk if we do nothing
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: dropdown
    id: blast
    attributes:
      label: Blast radius
      options:
        - Single module
        - Multiple modules
        - Cross-cutting or schema level
    validations:
      required: true
