name: Bug
description: A defect in Autonomous feature delivery.
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Numbered steps that reliably reproduce the defect.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - copilot
        - development
        - development (Bug triage fix verify)
        - momma
        - production
        - production (Bug triage fix verify)
        - staging
        - staging (Bug triage fix verify)
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical — outage or data loss
        - High — major function unusable
        - Medium — workaround exists
        - Low — cosmetic
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or trace IDs
