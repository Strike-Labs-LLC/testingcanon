<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rocket Launch</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #041836;
        color: #fff;
      }

      .app {
        text-align: center;
      }

      button {
        padding: 0.75rem 1.25rem;
        border: none;
        border-radius: 0.5rem;
        background: #1f7aff;
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
      }

      .launchpad {
        margin-top: 1.5rem;
        height: 170px;
        width: 200px;
        position: relative;
        overflow: hidden;
      }

      .rocket {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        font-size: 3rem;
        opacity: 0;
      }

      .rocket.launch {
        animation: blastoff 1.5s ease-in forwards;
      }

      .asteroid {
        position: absolute;
        top: 10px;
        right: 10px;
        font-size: 2.5rem;
        opacity: 0;
      }

      .asteroid.launch {
        animation: asteroid-entry 1.5s ease-in forwards;
      }

      .explosion {
        position: absolute;
        bottom: 50px;
        left: 50%;
        transform: translateX(-50%) scale(0.2);
        font-size: 3.5rem;
        opacity: 0;
        pointer-events: none;
      }

      .explosion.launch {
        animation: explode 1.5s ease-out forwards;
      }

      @keyframes blastoff {
        0% {
          transform: translate(-50%, 0);
          opacity: 1;
        }
        66% {
          transform: translate(-50%, -70px);
          opacity: 1;
        }
        67%,
        100% {
          transform: translate(-50%, -70px);
          opacity: 0;
        }
      }

      @keyframes asteroid-entry {
        0% {
          transform: translate(50px, -40px);
          opacity: 1;
        }
        66% {
          transform: translate(-55px, 65px);
          opacity: 1;
        }
        67%,
        100% {
          transform: translate(-55px, 65px);
          opacity: 0;
        }
      }

      @keyframes explode {
        0%,
        66% {
          transform: translateX(-50%) scale(0.2);
          opacity: 0;
        }
        67% {
          transform: translateX(-50%) scale(1.2);
          opacity: 1;
        }
        100% {
          transform: translateX(-50%) scale(2);
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .rocket.launch,
        .asteroid.launch,
        .explosion.launch {
          animation: none;
        }
        .rocket.launch {
          opacity: 0;
        }
        .asteroid.launch {
          opacity: 0;
        }
        .explosion.launch {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>Rocket Launch Demo</h1>
      <button id="launchButton" type="button">Launch Rocket</button>
      <div class="launchpad" aria-live="polite">
        <span id="rocket" class="rocket" role="img" aria-label="rocket ship">🚀</span>
        <span id="asteroid" class="asteroid" role="img" aria-label="asteroid">☄️</span>
        <span id="explosion" class="explosion" role="img" aria-label="explosion">💥</span>
      </div>
    </main>
    <script>
      const launchButton = document.getElementById("launchButton");
      const rocket = document.getElementById("rocket");
      const asteroid = document.getElementById("asteroid");
      const explosion = document.getElementById("explosion");

      const animatedElements = [rocket, asteroid, explosion];

      launchButton.addEventListener("click", () => {
        animatedElements.forEach((el) => el.classList.remove("launch"));
        void rocket.offsetWidth;
        animatedElements.forEach((el) => el.classList.add("launch"));
      });
    </script>
  </body>
</html>
