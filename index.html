<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rocket Launch</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #041836;
        color: #fff;
      }

      .app {
        text-align: center;
      }

      button {
        padding: 0.75rem 1.25rem;
        border: none;
        border-radius: 0.5rem;
        background: #1f7aff;
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
      }

      .launchpad {
        margin-top: 1.5rem;
        height: 170px;
        width: 200px;
        position: relative;
        overflow: hidden;
      }

      .rocket {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        font-size: 3rem;
        opacity: 0;
      }

      .rocket.launch {
        animation: blastoff 1.5s ease-in forwards;
        opacity: 1;
      }

      @keyframes blastoff {
        from {
          transform: translate(-50%, 0);
        }
        to {
          transform: translate(-50%, -200px);
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>Rocket Launch Demo</h1>
      <button id="launchButton" type="button">Launch Rocket</button>
      <div class="launchpad" aria-live="polite">
        <span id="rocket" class="rocket" role="img" aria-label="rocket ship">🚀</span>
      </div>
    </main>
    <script>
      const launchButton = document.getElementById("launchButton");
      const rocket = document.getElementById("rocket");

      launchButton.addEventListener("click", () => {
        rocket.classList.remove("launch");
        void rocket.offsetWidth;
        rocket.classList.add("launch");
      });
    </script>
  </body>
</html>
