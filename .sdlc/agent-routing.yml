# Which agent handles which stage, and how work is routed.
platform: github
agents:
  - slug: specification-writer
    file: .github/agents/01-specification-writer.agent.md
    role: product_manager
    model: google/gemini-3.6-flash
    label: "Product Manager"
  - slug: solution-architect
    file: .github/agents/02-solution-architect.agent.md
    role: architect
    model: google/gemini-3.6-flash
    label: "Architect"
  - slug: engineering-manager
    file: .github/agents/03-engineering-manager.agent.md
    role: engineering_manager
    model: google/gemini-3.6-flash
    label: "Engineering Manager"
  - slug: feature-coder
    file: .github/agents/04-feature-coder.agent.md
    role: coder
    model: google/gemini-3.6-flash
    label: "Coder"
  - slug: test-author
    file: .github/agents/05-test-author.agent.md
    role: tester
    model: google/gemini-3.6-flash
    label: "Tester"
  - slug: qa-verifier
    file: .github/agents/06-qa-verifier.agent.md
    role: qa
    model: google/gemini-3.6-flash
    label: "QA"
  - slug: code-reviewer
    file: .github/agents/07-code-reviewer.agent.md
    role: code_reviewer
    model: google/gemini-3.6-flash
    label: "Code Reviewer"
  - slug: security-reviewer
    file: .github/agents/08-security-reviewer.agent.md
    role: security_auditor
    model: google/gemini-3.6-flash
    label: "Security Auditor"
  - slug: technical-auditor
    file: .github/agents/09-technical-auditor.agent.md
    role: release_reviewer
    model: google/gemini-3.6-flash
    label: "Release Reviewer"
  - slug: release-notes-author
    file: .github/agents/10-release-notes-author.agent.md
    role: release_engineer
    model: google/gemini-3.6-flash
    label: "Release Engineer"
  - slug: release-gatekeeper
    file: .github/agents/11-release-gatekeeper.agent.md
    role: release_reviewer
    model: google/gemini-3.6-flash
    label: "Release Reviewer"
human_gates:
  []
routing:
  assignment_api: >-
    Assign an issue to a custom agent with the GitHub REST or GraphQL Copilot assignment
    endpoint, passing the target repository, base branch, custom agent slug, and model.
  rules:
    - when_stage: specification-writer
      custom_agent: specification-writer
    - when_stage: solution-architect
      custom_agent: solution-architect
    - when_stage: engineering-manager
      custom_agent: engineering-manager
    - when_stage: feature-coder
      custom_agent: feature-coder
    - when_stage: test-author
      custom_agent: test-author
    - when_stage: qa-verifier
      custom_agent: qa-verifier
    - when_stage: code-reviewer
      custom_agent: code-reviewer
    - when_stage: security-reviewer
      custom_agent: security-reviewer
    - when_stage: technical-auditor
      custom_agent: technical-auditor
    - when_stage: release-notes-author
      custom_agent: release-notes-author
    - when_stage: release-gatekeeper
      custom_agent: release-gatekeeper
