# Which agent handles which stage, and how work is routed.
platform: github
agents:
  - slug: feature-coder
    file: .github/agents/01-feature-coder.agent.md
    role: coder
    model: google/gemini-3.6-flash
    label: "Coder"
  - slug: code-reviewer
    file: .github/agents/02-code-reviewer.agent.md
    role: code_reviewer
    model: google/gemini-3.6-flash
    label: "Code Reviewer"
  - slug: test-suite-runner
    file: .github/agents/03-test-suite-runner.agent.md
    role: tester
    model: google/gemini-3.6-flash
    label: "Tester"
  - slug: deployment-runner
    file: .github/agents/04-deployment-runner.agent.md
    role: devops_deploy
    model: google/gemini-3.6-flash
    label: "DevOps Deploy"
human_gates:
  []
routing:
  assignment_api: >-
    Assign an issue to a custom agent with the GitHub REST or GraphQL Copilot assignment
    endpoint, passing the target repository, base branch, custom agent slug, and model.
  rules:
    - when_stage: feature-coder
      custom_agent: feature-coder
    - when_stage: code-reviewer
      custom_agent: code-reviewer
    - when_stage: test-suite-runner
      custom_agent: test-suite-runner
    - when_stage: deployment-runner
      custom_agent: deployment-runner
