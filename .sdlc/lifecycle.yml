# Lifecycle stages, generated from the SDLC blueprint.
version: 7
entry: "requirements-analyst"
exits:
  - "release-gatekeeper"
stages:
  - id: requirements-analyst
    order: 1
    name: "Requirements Analyst"
    role: product_manager
    output: spec
    acceptance: "The requirements state the problem, the affected users, the scope, and the out-of-scope list without ambiguity."
  - id: acceptance-criteria-author
    order: 2
    name: "Acceptance Criteria Author"
    role: product_manager
    output: spec
    acceptance: "Every requirement maps to at least one criterion, and each criterion is verifiable without further clarification."
  - id: feature-coder
    order: 3
    name: "Feature Coder"
    role: coder
    output: code_diff
    acceptance: "The branch builds, the suite passes locally, every criterion has a test, and the diff stays inside the stated scope."
  - id: test-author
    order: 4
    name: "Test Author"
    role: tester
    output: test_report
    acceptance: "Every criterion has a test, the suite has been run against the candidate commit, and failures carry reproduction steps."
  - id: qa-verifier
    order: 5
    name: "QA Verifier"
    role: qa
    output: test_report
    acceptance: "Every required check command resolved for the repository has been run against the candidate commit.\nThe output of each command is attached to the report.\nEvery acceptance criterion in the specification has an explicit pass or fail verdict.\nEvery failing verdict names the failing command, its error output, and reproduction steps.\nNothing in the repository was modified by this stage."
  - id: code-reviewer
    order: 6
    name: "Code Reviewer"
    role: code_reviewer
    output: review_notes
    acceptance: "Every finding names a file, a line, and the required change, and the review states one clear outcome."
  - id: release-gatekeeper
    order: 7
    name: "Release Gatekeeper"
    role: release_reviewer
    output: approval
    acceptance: "Each readiness area is assessed in writing, and the decision is either approved or blocked with a named mitigation."
transitions:
  - from: requirements-analyst
    to: acceptance-criteria-author
    kind: always
    condition: "Always"
  - from: acceptance-criteria-author
    to: feature-coder
    kind: always
    condition: "Always"
  - from: feature-coder
    to: test-author
    kind: always
    condition: "Always"
  - from: test-author
    to: feature-coder
    kind: return
    condition: "If failed"
  - from: test-author
    to: qa-verifier
    kind: conditional
    condition: "If passed"
  - from: qa-verifier
    to: feature-coder
    kind: return
    condition: "If failed"
  - from: qa-verifier
    to: code-reviewer
    kind: conditional
    condition: "If passed"
  - from: code-reviewer
    to: feature-coder
    kind: return
    condition: "If changes required"
  - from: code-reviewer
    to: release-gatekeeper
    kind: conditional
    condition: "If approved"
  - from: release-gatekeeper
    to: feature-coder
    kind: return
    condition: "If blocked"
