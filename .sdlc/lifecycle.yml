# Lifecycle stages, generated from the SDLC blueprint.
version: 7
entry: "delivery-orchestrator"
exits:
  - "deployment-runner"
stages:
  - id: delivery-orchestrator
    order: 1
    name: "Delivery Orchestrator"
    role: orchestrator
    output: status_update
    acceptance: "The work item states the requested feature and the current stage, and every stage transition is recorded."
  - id: requirements-analyst
    order: 2
    name: "Requirements Analyst"
    role: product_manager
    output: spec
    acceptance: "The requirements state the problem, the affected users, the scope, and the out-of-scope list without ambiguity."
  - id: acceptance-criteria-author
    order: 3
    name: "Acceptance Criteria Author"
    role: product_manager
    output: spec
    acceptance: "Every requirement maps to at least one criterion, and each criterion is verifiable without further clarification."
  - id: feature-coder
    order: 4
    name: "Feature Coder"
    role: coder
    output: code_diff
    acceptance: "The branch builds, the suite passes locally, every criterion has a test, and the diff stays inside the stated scope."
  - id: code-reviewer
    order: 5
    name: "Code Reviewer"
    role: code_reviewer
    output: review_notes
    acceptance: "Every finding names a file, a line, and the required change, and the review states one clear outcome."
  - id: test-author
    order: 6
    name: "Test Author"
    role: tester
    output: test_report
    acceptance: "Every criterion has a test, the suite has been run against the candidate commit, and failures carry reproduction steps."
  - id: qa-verifier
    order: 7
    name: "QA Verifier"
    role: qa
    output: test_report
    acceptance: "Every acceptance criterion has an explicit pass or fail result, and each failure carries reproduction steps."
  - id: release-gatekeeper
    order: 8
    name: "Release Gatekeeper"
    role: release_reviewer
    output: approval
    acceptance: "Each readiness area is assessed in writing, and the decision is either approved or blocked with a named mitigation."
  - id: deployment-runner
    order: 9
    name: "Deployment Runner"
    role: devops_deploy
    output: deployment
    acceptance: "The deployment is healthy, smoke tests pass, and the rollback path is confirmed."
transitions:
  - from: delivery-orchestrator
    to: requirements-analyst
    kind: always
    condition: "Always"
  - from: requirements-analyst
    to: acceptance-criteria-author
    kind: always
    condition: "Always"
  - from: acceptance-criteria-author
    to: feature-coder
    kind: always
    condition: "Always"
  - from: feature-coder
    to: code-reviewer
    kind: split
    condition: "Always"
  - from: feature-coder
    to: test-author
    kind: split
    condition: "Always"
  - from: code-reviewer
    to: feature-coder
    kind: return
    condition: "If changes required"
  - from: test-author
    to: feature-coder
    kind: return
    condition: "If failed"
  - from: code-reviewer
    to: qa-verifier
    kind: conditional
    condition: "If approved"
  - from: test-author
    to: qa-verifier
    kind: conditional
    condition: "If passed"
  - from: qa-verifier
    to: feature-coder
    kind: return
    condition: "If failed"
  - from: qa-verifier
    to: release-gatekeeper
    kind: conditional
    condition: "If passed"
  - from: release-gatekeeper
    to: deployment-runner
    kind: conditional
    condition: "If approved"
  - from: release-gatekeeper
    to: feature-coder
    kind: return
    condition: "If blocked"
