# Lifecycle stages, generated from the SDLC blueprint.
version: 7
entry: "specification-writer"
exits:
  - "release-gatekeeper"
stages:
  - id: specification-writer
    order: 1
    name: "Specification Writer"
    role: product_manager
    output: spec
    acceptance: "The specification states the problem, scope, and exclusions, and every acceptance criterion is verifiable without further clarification."
  - id: solution-architect
    order: 2
    name: "Solution Architect"
    role: architect
    output: design_doc
    acceptance: "The design names the modules touched, the approach, the compatibility risks, and at least one considered alternative."
  - id: engineering-manager
    order: 3
    name: "Engineering Manager"
    role: engineering_manager
    output: design_doc
    acceptance: "The plan names the modules to change, the order of work, the known risks, and the tests that must exist before review."
  - id: feature-coder
    order: 4
    name: "Feature Coder"
    role: coder
    output: code_diff
    acceptance: "The branch builds, the suite passes locally, the diff stays inside the planned scope, and the SHA is recorded."
  - id: test-author
    order: 5
    name: "Test Author"
    role: tester
    output: test_report
    acceptance: "Every criterion has a test, the suite has been run against the candidate commit, and failures carry reproduction steps."
  - id: qa-verifier
    order: 6
    name: "QA Verifier"
    role: qa
    output: test_report
    acceptance: "Every required check command has been run with its output attached, and every acceptance criterion has an explicit result."
  - id: code-reviewer
    order: 7
    name: "Code Reviewer"
    role: code_reviewer
    output: review_notes
    acceptance: "Every finding names a file, a line, and the required change, and the review states one clear outcome."
  - id: security-reviewer
    order: 8
    name: "Security Reviewer"
    role: security_auditor
    output: security_report
    acceptance: "Each finding has a severity and a concrete remediation step, and the audit ends with a pass or fail outcome."
  - id: technical-auditor
    order: 9
    name: "Technical Auditor"
    role: release_reviewer
    output: review_notes
    acceptance: "Migrations, rollback, monitoring, and blast radius are each assessed in writing, and the outcome is one clear decision."
  - id: release-notes-author
    order: 10
    name: "Release Notes Author"
    role: release_engineer
    output: release_notes
    acceptance: "The version, changelog, rollback plan, and checklist are complete and match the audited diff."
  - id: release-gatekeeper
    order: 11
    name: "Release Gatekeeper"
    role: release_reviewer
    output: approval
    acceptance: "The decision names the evidence checked, and a blocked release states exactly what is missing."
transitions:
  - from: specification-writer
    to: solution-architect
    kind: always
    condition: "Always"
  - from: solution-architect
    to: engineering-manager
    kind: always
    condition: "Always"
  - from: engineering-manager
    to: feature-coder
    kind: always
    condition: "Always"
  - from: feature-coder
    to: test-author
    kind: always
    condition: "Always"
  - from: test-author
    to: feature-coder
    kind: return
    condition: "If failed"
  - from: test-author
    to: qa-verifier
    kind: conditional
    condition: "If passed"
  - from: qa-verifier
    to: feature-coder
    kind: return
    condition: "If failed"
  - from: qa-verifier
    to: code-reviewer
    kind: conditional
    condition: "If passed"
  - from: code-reviewer
    to: feature-coder
    kind: return
    condition: "If changes required"
  - from: code-reviewer
    to: security-reviewer
    kind: conditional
    condition: "If approved"
  - from: security-reviewer
    to: feature-coder
    kind: return
    condition: "If failed"
  - from: security-reviewer
    to: technical-auditor
    kind: conditional
    condition: "If passed"
  - from: technical-auditor
    to: feature-coder
    kind: return
    condition: "If changes required"
  - from: technical-auditor
    to: release-notes-author
    kind: conditional
    condition: "If approved"
  - from: release-notes-author
    to: release-gatekeeper
    kind: always
    condition: "Always"
  - from: release-gatekeeper
    to: feature-coder
    kind: return
    condition: "If blocked"
