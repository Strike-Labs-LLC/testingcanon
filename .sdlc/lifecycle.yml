# Lifecycle stages, generated from the SDLC blueprint.
version: 7
entry: "feature-coder"
exits:
  - "deployment-runner"
stages:
  - id: feature-coder
    order: 1
    name: "Feature Coder"
    role: coder
    output: code_diff
    acceptance: "The branch builds, the suite passes locally, and the pull request describes the change and its scope."
  - id: code-reviewer
    order: 2
    name: "Code Reviewer"
    role: code_reviewer
    output: review_notes
    acceptance: "Every finding names a file and line and states the change required, and the review ends with one outcome."
  - id: test-suite-runner
    order: 3
    name: "Test Suite Runner"
    role: tester
    output: test_report
    acceptance: "The suite has been run against the candidate commit and the result is reported with logs for any failure."
  - id: deployment-runner
    order: 4
    name: "Deployment Runner"
    role: devops_deploy
    output: deployment
    acceptance: "The deployment is healthy, smoke tests pass, and the rollback path is confirmed."
transitions:
  - from: feature-coder
    to: code-reviewer
    kind: always
    condition: "Always"
  - from: code-reviewer
    to: test-suite-runner
    kind: conditional
    condition: "If approved"
  - from: code-reviewer
    to: feature-coder
    kind: return
    condition: "If changes required"
  - from: test-suite-runner
    to: deployment-runner
    kind: conditional
    condition: "If passed"
  - from: test-suite-runner
    to: feature-coder
    kind: return
    condition: "If failed"
