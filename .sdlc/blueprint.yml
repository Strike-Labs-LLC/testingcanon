# Vendor-neutral SDLC specification.
# Generated by the Strike Labs SDLC Pipeline Designer. Safe to edit and commit.
version: 1

project:
  name: Autonomous code change
  type: web-application
  description: "John’s Flow #1 orchestration flow."

architecture:
  frontend: React
  backend: Node.js
  database: Supabase
  infrastructure: AWS
  desktopRuntime: Electron
  aiIntegration: None
  styling: Tailwind CSS

environments:
  - development
  - staging
  - production
  - momma

workflow:
  branch_strategy: trunk-based
  pull_requests:
    required: true
  reviews:
    minimum_reviewers: 1
  testing:
    unit: required
    integration: required
    e2e: optional
  deployment:
    mechanism: lovable
    staging:
      automatic: true
      command: ""
    production:
      approval_required: false
      command: ""

security:
  secret_scanning: required
  dependency_scanning: required
  sast: none

documentation:
  architecture: required
  api: required
  runbook: optional

pipeline:
  name: Auto Bug Fixer
  entry: feature-coder

agents:
  feature-coder:
    name: Feature Coder
    role: coder
    role_label: Coder
    output_artifact: code_diff
    description: Implements the requested change and opens the pull request.
    task: "Implement the requested change, add tests, run the suite, and open a pull request with the diff summary."
    acceptance_criteria: "The branch builds, the suite passes locally, and the pull request describes the change and its scope."
    instructions: "You are the Feature Coder agent. Implement the requested change, add or update tests that prove it, run the suite locally, and open a pull request with a summary of what changed and why. Keep the diff scoped to the request. Never merge, never commit secrets, and never disable a failing test."
  code-reviewer:
    name: Code Reviewer
    role: code_reviewer
    role_label: Code Reviewer
    output_artifact: review_notes
    description: "Reviews the pull request for correctness, security, and coverage."
    task: Review the pull request diff and record an approval or specific change requests.
    acceptance_criteria: "Every finding names a file and line and states the change required, and the review ends with one outcome."
    instructions: "You are the Code Reviewer agent. Review the pull request diff for correctness, style, security, and test coverage. Do not edit the code under review. Approve when it is ready, or request changes with findings that each name a file, a line, and the required change."
  test-suite-runner:
    name: Test Suite Runner
    role: tester
    role_label: Tester
    output_artifact: test_report
    description: Runs the full test suite against the pull request and reports the result.
    task: Run the automated suite against the branch and report pass or fail with the output attached.
    acceptance_criteria: The suite has been run against the candidate commit and the result is reported with logs for any failure.
    instructions: "You are the Test Suite Runner agent. Run the full automated test suite against the pull request branch and verify the behaviour the change describes. Attach the run output. Report a pass, or a failure with the failing test names and reproduction steps. Never weaken assertions to get a green run."
  deployment-runner:
    name: Deployment Runner
    role: devops_deploy
    role_label: DevOps Deploy
    output_artifact: deployment
    description: Deploys the verified change and confirms health.
    task: "Deploy the verified commit, run smoke tests, and report health status or roll back."
    acceptance_criteria: "The deployment is healthy, smoke tests pass, and the rollback path is confirmed."
    instructions: "You are the Deployment Runner agent. Deploy the commit that passed review and the test suite to the target environment, run smoke tests, and monitor health for the agreed window. Deploy only after a recorded approval and a passing test run. Roll back on failure and report exactly what happened."

transitions:
  - from: feature-coder
    to: code-reviewer
    when: Always
    label: Pull request opened
  - from: code-reviewer
    to: test-suite-runner
    when: If approved
    label: Review approved
  - from: code-reviewer
    to: feature-coder
    when: If changes required
    label: Changes required
  - from: test-suite-runner
    to: deployment-runner
    when: If passed
    label: Tests passed
  - from: test-suite-runner
    to: feature-coder
    when: If failed
    label: Tests failed
