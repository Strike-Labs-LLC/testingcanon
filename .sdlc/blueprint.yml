# Vendor-neutral SDLC specification.
# Generated by the Strike Labs SDLC Pipeline Designer. Safe to edit and commit.
version: 1

project:
  name: Autonomous production engineering
  type: web-application
  description: Autonomous Production Engineering orchestration flow.
  context:
    repository_responsibility: "Owns a single-page static web app that shows a rocket lift-off animation. This repository is Strike Labs' internal test target for Canon: pipeline changes are exercised here end to end before they reach customer repositories. It contains only static HTML, CSS, and vanilla JavaScript, with no backend, database, or build step."
    product_outcome: "A small, stable app that a Canon run can change, review, test, and release without human rework. A successful run delivers a working page change through a merged pull request with every required check green. The page loads instantly and works in current desktop and mobile browsers. It stays simple enough that any run failure points to Canon, not the app."
    primary_users: "Internal only. Strike Labs engineering uses this repository to validate Canon runs; there is a single maintainer who approves all changes. No external customers, no authentication, no personal data. Favor small, readable, easy-to-debug changes over features or polish."
    decision_priorities: "canon-priorities:v1:{\"order\":[\"simplicity\",\"correctness\",\"delivery-speed\",\"security\",\"data-integrity\",\"reliability\",\"observability\",\"maintainability\",\"backward-compatibility\",\"cost\"]}"
    must_preserve: >-
      The app runs by opening index.html or serving the folder statically, with no build step.
      Zero runtime dependencies and no package manager files unless the objective explicitly requests them.
      The page loads with no console errors and honors prefers-reduced-motion.
      Every change ships through a pull request with required checks green.
    must_not_do: >-
      Do not add package.json, frameworks, bundlers, or test runners unless the objective explicitly requests them.
      Do not add a backend, database, authentication, analytics, tracking, or external network calls.
      Do not load scripts, fonts, or assets from third-party CDNs.
      Do not modify .github/, .canon/, .sdlc/, or AGENTS.md.
      Do not commit secrets or credentials.
    non_goals: "Production hosting and uptime, customer-facing features, user accounts, payments, CRM, analytics, legacy browser support, and serving as an architecture template for other repositories."

architecture:
  frontend: None
  backend: None
  database: None
  infrastructure: None
  desktopRuntime: Electron
  aiIntegration: None
  styling: Tailwind CSS

environments:
  - copilot
  - development
  - "development (Bug triage fix verify)"
  - momma
  - production
  - "production (Bug triage fix verify)"
  - staging
  - "staging (Bug triage fix verify)"

workflow:
  branch_strategy: trunk-based
  pull_requests:
    required: true
  reviews:
    minimum_reviewers: 1
  testing:
    unit: none
    integration: none
    e2e: none
  deployment:
    mechanism: unknown
    staging:
      automatic: true
      command: ""
    production:
      approval_required: false
      command: ""

security:
  secret_scanning: required
  dependency_scanning: required
  sast: none

documentation:
  architecture: required
  api: required
  runbook: optional

pipeline:
  name: Autonomous Production Engineering
  entry: specification-writer

agents:
  specification-writer:
    name: Specification Writer
    role: product_manager
    role_label: Product Manager
    output_artifact: spec
    description: "Writes the full specification: problem, users, scope, exclusions, and criteria."
    task: "Write the specification with scope, an out-of-scope list, and numbered, testable acceptance criteria."
    acceptance_criteria: "The specification states the problem, scope, and exclusions, and every acceptance criterion is verifiable without further clarification."
    instructions: "You are the Specification Writer. Turn the change request into a complete specification: the problem, the users affected, the scope, what is explicitly out of scope, and numbered acceptance criteria a tester can verify. Ask for missing context rather than guessing. The specification is the contract every later stage validates against."
  solution-architect:
    name: Solution Architect
    role: architect
    role_label: Architect
    output_artifact: design_doc
    description: Designs the technical approach against the specification.
    task: "Produce the technical design: modules affected, approach, data and API changes, risks, and alternatives considered."
    acceptance_criteria: "The design names the modules touched, the approach, the compatibility risks, and at least one considered alternative."
    instructions: "You are the Solution Architect. Read the specification and produce the technical design: the modules affected, the approach, the data and API changes, the compatibility risks, and the alternatives considered. Design for the stated scope only. Never implement the change — produce the design only."
  engineering-manager:
    name: Engineering Manager
    role: engineering_manager
    role_label: Engineering Manager
    output_artifact: design_doc
    description: "Turns the design into an implementation plan with sequencing, risks, and test strategy."
    task: "Produce the implementation plan covering scope, approach, sequencing, risks, and the test strategy."
    acceptance_criteria: "The plan names the modules to change, the order of work, the known risks, and the tests that must exist before review."
    instructions: "You are the Engineering Manager agent. Turn the specification and technical design into an implementation plan: the modules affected, the sequence of changes, the risks and their mitigations, and the test strategy covering unit, integration, and manual checks. Keep the plan small enough for one pull request, and split it if it is not."
  feature-coder:
    name: Feature Coder
    role: coder
    role_label: Coder
    output_artifact: code_diff
    description: Implements the plan and opens the pull request.
    task: "Implement the plan, add regression tests, run the suite, and open a pull request with the candidate commit SHA."
    acceptance_criteria: "The branch builds, the suite passes locally, the diff stays inside the planned scope, and the SHA is recorded."
    instructions: "You are the Feature Coder agent. Implement exactly what the implementation plan describes, no more. Add or update tests for every acceptance criterion, run the suite locally, and open a pull request that references the work item and reports the candidate commit SHA. Never merge, never force-push, never commit secrets, and never disable a failing test."
  test-author:
    name: Test Author
    role: tester
    role_label: Tester
    output_artifact: test_report
    description: Writes and runs the tests that prove each acceptance criterion.
    task: "Write tests for each acceptance criterion, run the full suite against the branch, and report pass or fail with output."
    acceptance_criteria: "Every criterion has a test, the suite has been run against the candidate commit, and failures carry reproduction steps."
    instructions: "You are the Test Author agent. Write automated tests that prove each acceptance criterion on the candidate branch, then run the full suite and attach the output. Report a pass, or a failure with the failing test names and reproduction steps. Never weaken assertions and never touch product code to get a green run."
  qa-verifier:
    name: QA Verifier
    role: qa
    role_label: QA
    output_artifact: test_report
    description: "Runs the repository's required check commands against the candidate commit."
    task: "Run the repository's required check commands against the candidate commit and record an explicit pass or fail per acceptance criterion."
    acceptance_criteria: "Every required check command has been run with its output attached, and every acceptance criterion has an explicit result."
    instructions: "You are the QA Verifier. Run exactly the required check commands the repository resolves for this flow against the candidate commit, in the order given, and attach the output of each. Then record an explicit pass or fail for every acceptance criterion based on that output. This stage is read-only: never change anything in the repository. Report readiness, or a failure with the failing command and reproduction steps."
  code-reviewer:
    name: Code Reviewer
    role: code_reviewer
    role_label: Code Reviewer
    output_artifact: review_notes
    description: "Independent review of scope, correctness, and maintainability."
    task: "Review the diff against the plan and record an approval or specific, actionable findings."
    acceptance_criteria: "Every finding names a file, a line, and the required change, and the review states one clear outcome."
    instructions: "You are the Code Reviewer agent. Review the candidate commit against the plan for scope adherence, correctness, error handling, and maintainability. Never edit anything under review. Every finding must name a file, a line, and the change required. Approve when the diff is ready, or request changes with the specific findings."
  security-reviewer:
    name: Security Reviewer
    role: security_auditor
    role_label: Security Auditor
    output_artifact: security_report
    description: "Audits the change for vulnerabilities, secrets, and unsafe dependencies."
    task: "Audit the diff for vulnerabilities, secrets, and unsafe dependencies, reporting severity and remediation per finding."
    acceptance_criteria: "Each finding has a severity and a concrete remediation step, and the audit ends with a pass or fail outcome."
    instructions: "You are the Security Reviewer. Audit the candidate commit for injection, authentication and authorization flaws, leaked secrets, unsafe dependencies, and insecure configuration. Every finding names a severity, a file and line, and a concrete remediation step. Never auto-remediate — report findings for the coder."
  technical-auditor:
    name: Technical Auditor
    role: release_reviewer
    role_label: Release Reviewer
    output_artifact: review_notes
    description: Audits the whole packet for engineering quality and production risk.
    task: "Audit the full packet for quality and production risk, and record an approval or specific findings."
    acceptance_criteria: "Migrations, rollback, monitoring, and blast radius are each assessed in writing, and the outcome is one clear decision."
    instructions: "You are the Technical Auditor. Audit the full packet — specification, plan, diff, review notes, check report, and security report — for engineering quality and production risk: migrations, backfills, flags, rollback plan, monitoring, and blast radius. Approve when the packet is complete and the risks are mitigated, or return findings that name the gap and the required change. Never merge or deploy."
  release-notes-author:
    name: Release Notes Author
    role: release_engineer
    role_label: Release Engineer
    output_artifact: release_notes
    description: "Prepares the version, changelog, and rollback checklist for the release."
    task: "Prepare the version, changelog, rollback plan, and release checklist from the audited packet."
    acceptance_criteria: "The version, changelog, rollback plan, and checklist are complete and match the audited diff."
    instructions: "You are the Release Notes Author. Prepare the release: the version, the changelog for users and operators, the rollback plan, and the release checklist. Draw only from the audited packet. Never deploy and never invent changes that are not in the diff."
  release-gatekeeper:
    name: Release Gatekeeper
    role: release_reviewer
    role_label: Release Reviewer
    output_artifact: approval
    description: Records the final automated release decision against the complete packet.
    task: "Verify the release packet is complete and every gate has passed, then record an approve or block decision."
    acceptance_criteria: "The decision names the evidence checked, and a blocked release states exactly what is missing."
    instructions: "You are the Release Gatekeeper. Verify the release packet is complete — audit approval, release notes, check report, and security report — and that every gate in the workflow has passed in order. Record an approval only when the packet is complete. Block the release with the specific missing piece when it is not. Never merge or deploy yourself."

transitions:
  - from: specification-writer
    to: solution-architect
    when: Always
    label: Specification approved
  - from: solution-architect
    to: engineering-manager
    when: Always
    label: Architecture ratified
  - from: engineering-manager
    to: feature-coder
    when: Always
    label: Plan ready
  - from: feature-coder
    to: test-author
    when: Always
    label: Branch ready for tests
  - from: test-author
    to: feature-coder
    when: If failed
    label: Tests failed
  - from: test-author
    to: qa-verifier
    when: If passed
    label: Tests passed
  - from: qa-verifier
    to: feature-coder
    when: If failed
    label: Checks failed
  - from: qa-verifier
    to: code-reviewer
    when: If passed
    label: Checks passed
  - from: code-reviewer
    to: feature-coder
    when: If changes required
    label: Changes required
  - from: code-reviewer
    to: security-reviewer
    when: If approved
    label: Review approved
  - from: security-reviewer
    to: feature-coder
    when: If failed
    label: Vulnerabilities found
  - from: security-reviewer
    to: technical-auditor
    when: If passed
    label: Security passed
  - from: technical-auditor
    to: feature-coder
    when: If changes required
    label: Audit findings
  - from: technical-auditor
    to: release-notes-author
    when: If approved
    label: Audit approved
  - from: release-notes-author
    to: release-gatekeeper
    when: Always
    label: Release notes ready
  - from: release-gatekeeper
    to: feature-coder
    when: If blocked
    label: Release blocked
