# Quality gates enforced before merge and before release.
merge:
  pull_request_required: true
  minimum_reviewers: 1
  code_owner_review_required: false
  required_checks:
    - Lint
    - Build
    - Unit tests
    - Integration tests
    - Dependency review
testing:
  unit: required
  integration: required
  e2e: optional
release:
  staging_automatic: true
  production_approval_required: false
